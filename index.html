<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A Latin proverb to learn together.">
    <title>Latin Proverb of the Day</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="laurel laurel-left" aria-hidden="true">❧</div>
    <div class="laurel laurel-right" aria-hidden="true">❧</div>
    <main class="card">
      <header class="masthead">
        <p class="eyebrow">❖  Ad usum vitae  ❖</p>
        <h1>Latin Proverb<br><em>of the Day</em></h1>
        <p class="date" id="date">Loading…</p>
      </header>
      <div class="divider" aria-hidden="true"><span>✦</span></div>
      <blockquote>
        <p class="latin" id="latin">Loading…</p>
        <p class="translation" id="translation"></p>
      </blockquote>
      <p class="meaning" id="meaning"></p>
      <section class="anecdote" aria-labelledby="anecdote-title">
        <h2 id="anecdote-title">A little history</h2>
        <p id="anecdote"></p>
      </section>
      <section class="reflection" aria-labelledby="reflection-title">
        <h2 id="reflection-title">Question to ponder</h2>
        <p class="prompt" id="prompt"></p>
      </section>
      <footer class="footer">✦  Shared between two curious minds  ✦</footer>
    </main>

    <button class="feedback-tab" id="feedback-toggle" type="button" aria-expanded="false" aria-controls="feedback-panel">
      Leave a verdict
    </button>
    <aside class="feedback-panel" id="feedback-panel" aria-hidden="true">
      <button class="feedback-close" id="feedback-close" type="button" aria-label="Close feedback">×</button>
      <p class="eyebrow">The tiny Roman council</p>
      <h2>How does the page feel?</h2>
      <p class="feedback-intro">Choose your verdict. The council has prepared a reply.</p>
      <div class="feedback-options" id="feedback-options">
        <button type="button" data-feedback="delightful"><span aria-hidden="true">✨</span> Surprisingly delightful</button>
        <button type="button" data-feedback="wise"><span aria-hidden="true">🏛️</span> Wisely curated</button>
        <button type="button" data-feedback="thoughtful"><span aria-hidden="true">🪶</span> Makes me think</button>
        <button type="button" data-feedback="cute"><span aria-hidden="true">🌿</span> Cute and clever</button>
      </div>
      <button class="honest-feedback" type="button" data-feedback="honest">
        <span class="sticker" aria-hidden="true">☹</span> Not my thing
      </button>
      <div class="feedback-result" id="feedback-result" aria-live="polite" hidden>
        <p class="feedback-reply" id="feedback-reply"></p>
      </div>
    </aside>
    <script>
      let currentProverb = null;
      fetch("data/today.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error("Could not load today's proverb");
          return response.json();
        })
        .then((proverb) => {
          currentProverb = proverb;
          document.getElementById("date").textContent = proverb.date;
          document.getElementById("latin").textContent = proverb.latin;
          document.getElementById("translation").textContent = proverb.translation;
          document.getElementById("meaning").textContent = proverb.meaning;
          document.getElementById("anecdote").textContent = proverb.anecdote;
          document.getElementById("prompt").textContent = proverb.prompt;
          document.title = `${proverb.latin} — Latin Proverb of the Day`;
        })
        .catch((error) => {
          document.getElementById("latin").textContent = "Unable to load today's proverb.";
          console.error(error);
        });

      const feedbackToggle = document.getElementById("feedback-toggle");
      const feedbackClose = document.getElementById("feedback-close");
      const feedbackPanel = document.getElementById("feedback-panel");
      const feedbackOptions = document.getElementById("feedback-options");
      const honestFeedback = document.querySelector(".honest-feedback");
      const feedbackResult = document.getElementById("feedback-result");
      const feedbackReply = document.getElementById("feedback-reply");
      const setFeedbackOpen = (isOpen) => {
        feedbackToggle.setAttribute("aria-expanded", String(isOpen));
        feedbackPanel.setAttribute("aria-hidden", String(!isOpen));
        feedbackPanel.classList.toggle("is-open", isOpen);
        if (isOpen) feedbackPanel.querySelector("button").focus();
      };
      feedbackToggle.addEventListener("click", () => setFeedbackOpen(true));
      feedbackClose.addEventListener("click", () => setFeedbackOpen(false));

      const replies = {
        delightful: [
          "The Senate is pleased. Your taste has been entered into the marble record.",
          "A radiant verdict. Even the laurel leaves are rustling approvingly.",
          "Excellent. The proverb has found a worthy patron.",
          "The Muses have sent a thank-you tablet. It is very flattering.",
          "Your enthusiasm has been awarded a tiny honorary triumph."
        ],
        wise: [
          "A sound judgment. Cicero would have raised one elegant eyebrow.",
          "Prudent and discerning. The council nods beneath its ceremonial helmets.",
          "Wisdom recognizes wisdom. The archive has made a respectful bow.",
          "A verdict fit for a philosopher with excellent sandals.",
          "Your discernment has been chiselled into an imaginary column."
        ],
        thoughtful: [
          "The proverb has planted a small philosophical seed. Water it occasionally.",
          "A thoughtful pause in a hurried world. Seneca would approve.",
          "Your mind has wandered somewhere interesting. Do bring back souvenirs.",
          "The question has been received by the inner forum.",
          "A fine choice. The ancient thinkers are now quietly taking notes."
        ],
        cute: [
          "The council declares it charming enough for a very tasteful villa.",
          "A little green laurel crown has been placed upon your verdict.",
          "Cute, clever, and properly toga-adjacent.",
          "The proverb blushed. Fortunately, the marble statues noticed nothing.",
          "A delightful judgment from the unofficial curator of good things."
        ],
        honest: [
          "Brutal, but fair. The proverb has been sent to reflect on its choices.",
          "The council accepts your dissent and dramatically consults a scroll.",
          "Not every maxim can conquer every heart. Even Rome had critics.",
          "A courageous verdict. The proverb will now stare moodily at the horizon.",
          "Your honesty has been received with a solemn nod and a small sigh."
        ]
      };

      const showReply = (choice) => {
        const choices = replies[choice];
        feedbackReply.textContent = choices[Math.floor(Math.random() * choices.length)];
        feedbackOptions.hidden = true;
        honestFeedback.hidden = true;
        feedbackResult.hidden = false;
        feedbackResult.classList.remove("feedback-result-pop");
        void feedbackResult.offsetWidth;
        feedbackResult.classList.add("feedback-result-pop");
      };

      document.querySelectorAll("[data-feedback]").forEach((button) => {
        button.addEventListener("click", () => showReply(button.dataset.feedback));
      });
    </script>
  </body>
</html>
