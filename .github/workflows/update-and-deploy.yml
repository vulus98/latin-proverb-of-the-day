name: Update and deploy

on:
  workflow_dispatch:
    inputs:
      generate:
        description: "Generate a new proverb with Gemini before deploying"
        required: false
        default: false
        type: boolean
  schedule:
    # Check every 15 minutes so a delayed GitHub schedule can recover promptly.
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update at 09:00 Europe/Belgrade
        id: publish
        run: |
          local_day="$(TZ=Europe/Belgrade date +%u)"
          local_hour="$(TZ=Europe/Belgrade date +%H)"
          local_date="$(TZ=Europe/Belgrade date +%F)"
          schedule_window=false
          if [ "$local_day" = "2" ] || [ "$local_day" = "6" ]; then
            if [ "$local_hour" -ge 09 ]; then
              schedule_window=true
            fi
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$schedule_window" = "false" ]; then
            echo "Not an eligible Tuesday or Saturday update window; no update needed."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            should_generate=false
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.generate }}" = "true" ]; then
              should_generate=true
            fi
            if [ "$should_generate" = "true" ] && grep -q "\"date\": \"$local_date\"" data/seen.json; then
              echo "A proverb is already published for $local_date; no update needed."
              should_generate=false
            fi
            if [ "$should_generate" = "true" ]; then
              for attempt in $(seq 1 72); do
                set +e
                GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" FORCE_GENERATE="1" python scripts/update_proverb.py
                status=$?
                set -e
                if [ "$status" -eq 0 ]; then
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/today.json data/seen.json
                  git diff --cached --quiet || git commit -m "Update proverb of the day"
                  git push
                  echo "updated=true" >> "$GITHUB_OUTPUT"
                  break
                elif [ "$status" -ne 75 ]; then
                  echo "::error::Gemini failed with a non-retryable error; stopping so it can be fixed."
                  break
                elif [ "$attempt" -lt 72 ]; then
                  echo "::warning::Transient Gemini failure on attempt ${attempt}/72; retrying in 5 minutes."
                  sleep 300
                else
                  echo "::warning::Gemini generation still unavailable after 6 hours; keeping the previous proverb."
                fi
              done
            else
              echo "Manual deployment requested without Gemini generation."
              echo "updated=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
