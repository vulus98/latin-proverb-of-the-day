name: Update and deploy

on:
  workflow_dispatch:
    inputs:
      generate:
        description: "Generate a new proverb with Gemini before deploying"
        required: false
        default: false
        type: boolean
      send_test:
        description: "Send the current proverb reminder to my test number"
        required: false
        default: false
        type: boolean
  schedule:
    # Run hourly so the check remains at 09:00 in Europe/Belgrade across DST.
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update at 09:00 Europe/Belgrade
        id: publish
        run: |
          local_day="$(TZ=Europe/Belgrade date +%u)"
          local_hour="$(TZ=Europe/Belgrade date +%H)"
          schedule_window=false
          if [ "$local_day" = "2" ] || [ "$local_day" = "6" ]; then
            if [ "$local_hour" = "09" ]; then
              schedule_window=true
            fi
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$schedule_window" = "false" ]; then
            echo "Not Tuesday or Saturday at 09:00 Europe/Belgrade; no update needed."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            should_generate=false
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.generate }}" = "true" ]; then
              should_generate=true
            fi
            if [ "$should_generate" = "true" ]; then
              for attempt in $(seq 1 72); do
                set +e
                GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" FORCE_GENERATE="1" python scripts/update_proverb.py
                status=$?
                set -e
                if [ "$status" -eq 0 ]; then
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/today.json data/seen.json
                  git diff --cached --quiet || git commit -m "Update proverb of the day"
                  git push
                  echo "updated=true" >> "$GITHUB_OUTPUT"
                  break
                elif [ "$status" -ne 75 ]; then
                  echo "::error::Gemini failed with a non-retryable error; stopping so it can be fixed."
                  break
                elif [ "$attempt" -lt 72 ]; then
                  echo "::warning::Transient Gemini failure on attempt ${attempt}/72; retrying in 5 minutes."
                  sleep 300
                else
                  echo "::warning::Gemini generation still unavailable after 6 hours; keeping the previous proverb."
                fi
              done
            else
              echo "Manual deployment requested without Gemini generation."
              echo "updated=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Send WhatsApp reminder
        if: (steps.publish.outputs.updated == 'true' && github.event_name == 'schedule') || (inputs.send_test == true)
        env:
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        run: |
          teaser="$(python - <<'PY'
          import json
          meaning = json.load(open("data/today.json", encoding="utf-8"))["meaning"]
          print(meaning[:140].rstrip(" .") + ("…" if len(meaning) > 140 else ""))
          PY
          )"
          link="https://vulus98.github.io/latin-proverb-of-the-day/"
          recipient="+381605119995"
          if [ "${{ inputs.send_test }}" = "true" ]; then
            recipient="+381638991909"
          fi
          payload="$(python - "$teaser" "$link" "$recipient" <<'PY'
          import json
          import sys
          print(json.dumps({
              "messaging_product": "whatsapp",
              "to": sys.argv[3],
              "type": "template",
              "template": {
                  "name": "latin_proverb_update",
                  "language": {"code": "en_US"},
                  "components": [{
                      "type": "body",
                      "parameters": [
                          {"type": "text", "text": sys.argv[1]},
                          {"type": "text", "text": sys.argv[2]}
                      ]
                  }]
              }
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "https://graph.facebook.com/v22.0/${WHATSAPP_PHONE_NUMBER_ID}/messages" \
            -H "Authorization: Bearer ${WHATSAPP_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
