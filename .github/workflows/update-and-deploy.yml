name: Update and deploy

on:
  workflow_dispatch:
    inputs:
      generate:
        description: "Generate a new proverb with Gemini before deploying"
        required: false
        default: false
        type: boolean
  schedule:
    # Run hourly so the check remains at 09:00 in Europe/Belgrade across DST.
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update at 09:00 Europe/Belgrade
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Belgrade date +%H)" != "09" ]; then
            echo "Not 09:00 Europe/Belgrade; no update needed."
          else
            max_attempts=1
            if [ "${{ inputs.generate }}" = "true" ]; then
              max_attempts=72
            fi
            for attempt in $(seq 1 "$max_attempts"); do
              if GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" FORCE_GENERATE="${{ inputs.generate == true && '1' || '0' }}" python scripts/update_proverb.py; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add data/today.json data/seen.json
                git diff --cached --quiet || git commit -m "Update proverb of the day"
                git push
                break
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "::warning::Gemini attempt ${attempt}/${max_attempts} failed; retrying in 5 minutes."
                sleep 300
              else
                echo "::warning::Gemini generation failed after ${max_attempts} attempts; keeping the previous proverb."
              fi
            done
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
