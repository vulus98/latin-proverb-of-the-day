name: Update and deploy

on:
  workflow_dispatch:
  schedule:
    # Run hourly so the check remains at 09:00 in Europe/Belgrade across DST.
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update at 09:00 Europe/Belgrade
        run: |
          if [ "$(TZ=Europe/Belgrade date +%H)" = "09" ]; then
            python scripts/update_proverb.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/today.json data/seen.json
            git diff --cached --quiet || git commit -m "Update proverb of the day"
            git push
          else
            echo "Not 09:00 Europe/Belgrade; no update needed."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
